name: Rift CLMM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  interface:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: interface/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build production bundle
        env:
          VITE_SEISMIC_RPC_URL: https://testnet-3.seismictest.net/rpc
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build

  contracts:
    name: Smart Contracts Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Seismic Foundry (sforge & ssolc)
        run: |
          curl -fsSL https://raw.githubusercontent.com/SeismicSystems/seismic-foundry/seismic/foundryup/install | bash
          echo "$HOME/.seismic/bin" >> "$GITHUB_PATH"
          TAG="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/SeismicSystems/seismic-foundry/releases/latest | awk -F/ '{print $NF}')"
          "$HOME/.seismic/bin/sfoundryup" -i "$TAG"

      - name: Build contracts
        run: sforge build

      - name: Run contract tests
        run: sforge test -vv
